<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>爆弾回避ゲーム</title>

  <link rel="stylesheet" href="style.css">

  <!-- ★ Firebase v8（非モジュール版）を読み込む -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- ★ Firebase 初期化 -->
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyA443-F3M3PITTS-7aUlyxLkrJ345iXEjw",
      authDomain: "minigame-b29f6.firebaseapp.com",
      databaseURL: "https://minigame-b29f6-default-rtdb.firebaseio.com",
      projectId: "minigame-b29f6",
      storageBucket: "minigame-b29f6.firebasestorage.app",
      messagingSenderId: "257069069470",
      appId: "1:257069069470:web:fffafdbf39f6914f87778f"
    };

    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>

  <!-- ① メニュー画面 -->
  <div id="menuScreen">
    <h1>爆弾回避ゲーム1.0</h1>
    <button id="playBtn">プレイ</button><br>
    <button id="howToBtn">遊び方</button><br>
    <button id="rankingBtn">ランキング</button><br>
  </div>

  <!-- ② ニックネーム入力画面 -->
  <div id="nameScreen" style="display:none;">
    <h2>ニックネームを入力</h2>
    <input id="nickname" type="text" placeholder="ニックネーム"><br>
    <button id="startGameBtn">ゲーム開始</button><br>
  </div>

  <!-- ③ ゲーム画面 -->
  <div id="gameScreen" style="display:none;">
    <canvas id="gameCanvas"></canvas>
    <p id="score">生存時間: 0 秒 / コイン: 0 枚</p>
  </div>

  <!-- ④ ランキング画面 -->
  <div id="rankingScreen" style="display:none;">
    <h2>ランキング</h2>
    <div id="ranking"></div>
    <button id="backToMenuBtn">メニューに戻る</button>
  </div>

  <div id="joystick" style="display:none;">
    <div id="stick"></div>
  </div>

  <!-- ゲーム本体 -->
  <script src="script.js"></script>

</body>
